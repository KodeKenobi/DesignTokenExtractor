<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Capture Mock Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            height: 200vh; /* Scrollable for testing */
        }
        .hero {
            padding: 100px 50px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #1e293b; margin-bottom: 20px; }
        p { color: #64748b; font-size: 1.2rem; }
        .button {
            padding: 15px 30px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
        }
        #status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.8);
            color: lime;
            border-radius: 5px;
            z-index: 9999999;
        }
    </style>
</head>
<body>
    <div id="status">Mock Environment: ACTIVE</div>
    <div class="hero">
        <h1>Design Token Extractor Test Page</h1>
        <p>This is a mock page to test the Smart Capture tool.</p>
        <button class="button" onclick="startCapture()">Start Mock Capture</button>
    </div>

    <!-- MOCK CHROME API -->
    <script>
        window.chrome = {
            runtime: {
                lastError: null,
                sendMessage: (msg, callback) => {
                    console.log("Mock sendMessage:", msg);
                    if (msg.action === "captureVisibleTab") {
                        // Return a dummy transparent pixel screenshot
                        setTimeout(() => {
                            callback({ dataUrl: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==" });
                        }, 500);
                    } else if (msg.action === "getBlob") {
                        callback("https://example.com/mock-blob");
                    }
                },
                onMessage: {
                    addListener: (cb) => { console.log("Mock addListener"); }
                }
            }
        };

        function startCapture() {
            console.log("Starting Capture script manually...");
            // Load the script
            const s = document.createElement('script');
            s.src = 'capture.js';
            document.body.appendChild(s);
        }
    </script>
</body>
</html>
